[package]
name = "warp_logging"
edition = "2024"
description = "Warp logging configuration"
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
cfg-if.workspace = true
env_logger.workspace = true
log.workspace = true
warp_core.workspace = true
warp_errors.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs.workspace = true
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
# Log bundles only ever write Deflate entries (see native.rs), so only pull in zip's Deflate
# codec rather than its full default feature set.
zip = { version = "2.1", default-features = false, features = ["deflate-flate2", "flate2"] }
# zip's "deflate-flate2" feature pulls in flate2 but leaves its compression backend unselected;
# this dependency exists solely to turn on that backend (zip depends on flate2 with
# default-features = false, so nothing else provides one).
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

# Optional crash reporting integration.
sentry = { workspace = true, optional = true }
sentry-log = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.6" }
js-sys = "0.3.63"
wasm-bindgen.workspace = true
web-sys.workspace = true
warp_web_event_bus.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true

[features]
crash_reporting = ["dep:sentry", "dep:sentry-log", "warp_errors/crash_reporting"]
agent_mode_evals = []
