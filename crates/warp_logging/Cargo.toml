[package]
name = "warp_logging"
edition = "2024"
description = "Warp logging configuration"
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
cfg-if.workspace = true
env_logger.workspace = true
log.workspace = true
warp_core.workspace = true
warp_errors.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs.workspace = true
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
# zip 9 defaults enable bzip2 -> libbz2-rs-sys (license bzip2-1.0.6), which cargo-deny rejects.
zip = { version = "9.0.5", default-features = false, features = [
    "aes-crypto",
    "deflate",
    "deflate64",
    "lzma",
    "ppmd",
    "time",
    "xz",
    "zstd",
] }

# Optional crash reporting integration.
sentry = { workspace = true, optional = true }
sentry-log = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.6" }
js-sys = "0.3.63"
wasm-bindgen.workspace = true
web-sys.workspace = true
warp_web_event_bus.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true

[features]
crash_reporting = ["dep:sentry", "dep:sentry-log", "warp_errors/crash_reporting"]
agent_mode_evals = []
