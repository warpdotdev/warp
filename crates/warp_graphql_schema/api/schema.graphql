"""Metadata about resource usage within a conversation."""
type ConversationUsageMetadata {
  """Token usage using a user's API key, keyed by model."""
  byokTokenUsage: [TokenUsage!]!

  """
  Dev-only breakdown of the context window usage into segments
  (e.g. system prompt, tool definitions, history, latest input). Empty
  unless the feature is enabled server-side. Segment token counts add up
  to the token total represented by contextWindowUsage; the client derives
  per-segment percentages.
  """
  contextWindowSegments: [ContextWindowSegment!]!
  contextWindowUsage: Float!

  """The total number of inference credits spent so far in the conversation"""
  creditsSpent: Float!

  """The total number of platform credits spent so far in the conversation."""
  platformCreditsSpent: Float!
  summarized: Boolean!

  """
  Deprecated: Use warpTokenUsage and byokTokenUsage instead.
  This field combines both Warp API key and user API key usage.
  """
  tokenUsage: [ModelTokenUsage!]! @deprecated(reason: "Use warpTokenUsage and byokTokenUsage instead")
  toolUsageMetadata: ToolUsageMetadata!

  """
  The cumulative provider cost spent so far in the conversation, in cents
  (fractional cents allowed).
  Null when the server cannot establish a complete historical baseline.
  """
  totalProviderCostInCents: Float

  """Token usage using the Warp API key, keyed by model."""
  warpTokenUsage: [TokenUsage!]!
}

