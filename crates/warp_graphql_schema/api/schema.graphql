type CloudEnvironmentConfig {
  """
  The environment's forge. Legacy environments without a persisted value resolve to GITHUB.
  """
  codeForge: CodeForge!

  """
  Optional UID of a Runner used as the default runner for runs in this
  environment. A task's runner_id overrides it.
  """
  defaultRunnerUid: ID
  description: String
  dockerImage: String!

  """
  When set (1-60 minutes), a failed run using this environment keeps its session
  open for this many minutes so it can be inspected. null/absent means immediate
  teardown (disabled by default).
  
  This is an idle window held by the agent process itself: working in the session
  pushes it out, and it ends early if the sandbox reaches its own deadline first.
  The setting applies to future failures of runs using this environment; it does not
  change the window a currently-failed run was already started with.
  """
  failureSessionRetentionMinutes: Int

  """Legacy compatibility mirror of sourceRepos."""
  githubRepos: [GitHubRepo!]!
  name: String!
  providers: ProvidersConfig
