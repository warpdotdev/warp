[package]
name = "computer_use_mcp"
edition = "2024"
description = "Stdio MCP server that exposes computer use to external agent harnesses"
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
command.workspace = true
computer_use.workspace = true
log.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "rt",
    "signal",
    "sync",
    "time",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
async-trait.workspace = true
computer_use = { workspace = true, features = ["test-util"] }
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
