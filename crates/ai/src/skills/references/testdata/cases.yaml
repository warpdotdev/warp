# Shared skill reference parser cases. See README.md.

- name: shorthand_named_ref
  input: "source: acme/shared-skills@v1.4.0\ninclude: [safe-secrets, skills/release-notes, \"frontend/*\"]\nexclude: [\"legacy-*\"]\n"
  expected:
    reference:
      source: {code_forge: null, owner: "acme", repo: "shared-skills", ref: {kind: "named", value: "v1.4.0"}}
      include: [{kind: "name", value: "safe-secrets"}, {kind: "path", value: "skills/release-notes"}, {kind: "path_glob", value: "frontend/*"}]
      exclude: [{kind: "name_glob", value: "legacy-*"}]

- name: shorthand_host_github
  input: "source: github.com:acme/shared-skills\ninclude: [safe-secrets]\n"
  expected:
    reference:
      source: {code_forge: "GITHUB", owner: "acme", repo: "shared-skills", ref: null}
      include: [{kind: "name", value: "safe-secrets"}]
      exclude: []

- name: shorthand_host_gitlab_subgroups
  input: "source: gitlab.com:acme/platform/shared-skills\ninclude: [safe-secrets]\n"
  expected:
    reference:
      source: {code_forge: "GITLAB", owner: "acme/platform", repo: "shared-skills", ref: null}
      include: [{kind: "name", value: "safe-secrets"}]
      exclude: []

- name: shorthand_host_azure_devops
  input: "source: dev.azure.com:acme/project/shared-skills\ninclude: [safe-secrets]\n"
  expected:
    reference:
      source: {code_forge: "AZURE_DEVOPS", owner: "acme/project", repo: "shared-skills", ref: null}
      include: [{kind: "name", value: "safe-secrets"}]
      exclude: []

- name: mapping_github_sha
  input: "source: {codeForge: GITHUB, owner: acme, repo: shared-skills, ref: 0123456789abcdef0123456789abcdef01234567}\ninclude: [deploy]\n"
  expected:
    reference:
      source: {code_forge: "GITHUB", owner: "acme", repo: "shared-skills", ref: {kind: "sha", value: "0123456789abcdef0123456789abcdef01234567"}}
      include: [{kind: "name", value: "deploy"}]
      exclude: []

- name: globs
  input: "source: acme/shared-skills\ninclude: [\"*\", \"tool-?\", \"[a-c]*\", \"**/review-*\"]\nexclude: [\"experimental/**\"]\n"
  expected:
    reference:
      source: {code_forge: null, owner: "acme", repo: "shared-skills", ref: null}
      include: [{kind: "name_glob", value: "*"}, {kind: "name_glob", value: "tool-?"}, {kind: "name_glob", value: "[a-c]*"}, {kind: "path_glob", value: "**/review-*"}]
      exclude: [{kind: "path_glob", value: "experimental/**"}]

- name: mapping_ref_with_at
  input: "source: {owner: acme, repo: shared-skills, ref: feature@2026}\ninclude: [deploy]\n"
  expected:
    reference:
      source: {code_forge: null, owner: "acme", repo: "shared-skills", ref: {kind: "named", value: "feature@2026"}}
      include: [{kind: "name", value: "deploy"}]
      exclude: []

- name: path_root_skill
  input: "source: acme/shared-skills\ninclude: [./SKILL.md]\n"
  expected:
    reference:
      source: {code_forge: null, owner: "acme", repo: "shared-skills", ref: null}
      include: [{kind: "path", value: "./SKILL.md"}]
      exclude: []

- name: invalid_yaml_duplicate_key
  input: "source: acme/one\nsource: acme/two\ninclude: [safe-secrets]\n"
  expected: {error: invalid_yaml}

- name: yaml_alias_unquoted_star
  input: "source: acme/shared-skills\ninclude:\n  - *-review\n"
  expected: {error: yaml_alias}

- name: yaml_alias_anchor
  input: "source: &repo acme/shared-skills\ninclude: [safe-secrets]\nexclude:\n  - *repo\n"
  expected: {error: yaml_alias}

- name: unknown_key_source_name
  input: "source: {owner: acme, name: shared-skills}\ninclude: [safe-secrets]\n"
  expected: {error: unknown_key}

- name: missing_source_empty_file
  input: ""
  expected: {error: missing_source}

- name: malformed_source_no_slash
  input: "source: shared-skills\ninclude: [safe-secrets]\n"
  expected: {error: malformed_source}

- name: unknown_code_forge_host
  input: "source: bitbucket.org:acme/shared-skills\ninclude: [safe-secrets]\n"
  expected: {error: unknown_code_forge}

- name: malformed_ref_leading_dash
  input: "source: {owner: acme, repo: shared-skills, ref: \"-main\"}\ninclude: [safe-secrets]\n"
  expected: {error: malformed_ref}

- name: malformed_ref_sha256
  input: "source: acme/shared-skills@0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef\ninclude: [safe-secrets]\n"
  expected: {error: malformed_ref}

- name: missing_include
  input: "source: acme/shared-skills\n"
  expected: {error: missing_include}

- name: empty_include
  input: "source: acme/shared-skills\ninclude: []\n"
  expected: {error: empty_include}

- name: non_string_entry_number
  input: "source: acme/shared-skills\ninclude: [42]\n"
  expected: {error: non_string_entry}

- name: invalid_glob_unclosed_class
  input: "source: acme/shared-skills\ninclude: [\"[review\"]\n"
  expected: {error: invalid_glob}

- name: invalid_glob_reversed_range
  input: "source: acme/shared-skills\ninclude: [\"[z-a]*\"]\n"
  expected: {error: invalid_glob}

- name: absolute_path
  input: "source: acme/shared-skills\ninclude: [/skills/release-notes]\n"
  expected: {error: absolute_path}

- name: parent_path
  input: "source: acme/shared-skills\ninclude: [skills/../secrets]\n"
  expected: {error: parent_path}

- name: precedence_unknown_key_before_source
  input: "source: shared-skills\ninclude: [safe-secrets]\nlabels: [team]\n"
  expected: {error: unknown_key}

- name: precedence_entries_in_order
  input: "source: acme/shared-skills\ninclude: [safe-secrets, /skills/../review, \"[review\"]\n"
  expected: {error: absolute_path}
