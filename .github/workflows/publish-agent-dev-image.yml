# Builds and publishes the agent-dev base Docker image used by Warp cloud agents.
#
# The image is defined by docker/agent-dev/Dockerfile and mirrors the build in
# script/push-dev-image. It is published to Docker Hub as
# warpdotdev/warp-internal-dev:latest-dev.
#
# NOTE: this workflow requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# secrets to be provisioned on the repo (or org). They do not exist in this repo
# yet, so the push step will fail until an operator adds them (see the PR).
name: Publish agent-dev image

on:
  # Rebuild whenever the image definition or any file it copies in changes.
  push:
    branches: [master]
    paths:
      - docker/agent-dev/Dockerfile
      - rust-toolchain.toml
      - script/**
      - .github/workflows/publish-agent-dev-image.yml
  # Cron has no native "every 2 weeks", so rebuild on the 1st and 15th of each
  # month (00:00 UTC) to pick up upstream dependency updates.
  schedule:
    - cron: "0 0 1,15 * *"
  # Allow manual runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push agent-dev image
    runs-on: ubuntu-latest
    steps:
      - name: Check out warp
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push agent-dev image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/agent-dev/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: warpdotdev/warp-internal-dev:latest-dev
